<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0714">
<title>🎂 Ekta Surprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js" defer></script>
<style>
:root{
  --bg:#0b0714;--pink:#ff4ecd;--violet:#a78bfa;--lime:#c6ff3d;--sun:#ffd166;--sky:#4cc9f0;
  --glass:rgba(255,255,255,.09);--glass-b:rgba(255,255,255,.16);
  --fd:'Syne',system-ui,sans-serif;--fb:'Space Grotesk',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:#fff;font-family:var(--fb);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,input{font-family:inherit;color:inherit}
#app{position:fixed;inset:0;height:100dvh;max-width:520px;margin:0 auto;overflow:hidden;background:var(--bg)}
.step{position:absolute;inset:0;opacity:0;pointer-events:none;transform:scale(1.04);transition:opacity .55s ease,transform .55s ease}
.step.active{opacity:1;pointer-events:auto;transform:none}

/* ---------- desktop gate ---------- */
.gate{display:none;position:fixed;inset:0;z-index:999;background:var(--bg);align-items:center;justify-content:center;text-align:center;padding:24px;flex-direction:column;gap:18px}
body.desktop .gate{display:flex}body.desktop #app{display:none}
.gate h1{font-family:var(--fd);font-size:40px}
.gate img{width:180px;height:180px;border-radius:20px;background:#fff;padding:10px}
.gate p{opacity:.7}

/* ---------- blobs bg ---------- */
.mesh{position:absolute;inset:0;overflow:hidden;z-index:0}
.mesh i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 14s ease-in-out infinite alternate}
.mesh i:nth-child(1){background:var(--pink);top:-20%;left:-30%}
.mesh i:nth-child(2){background:var(--violet);bottom:-25%;right:-35%;animation-delay:-5s}
.mesh i:nth-child(3){background:var(--sky);width:40vmax;height:40vmax;top:40%;left:30%;opacity:.3;animation-delay:-9s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}

/* ---------- lock ---------- */
#lock{display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 56px) 24px calc(env(safe-area-inset-bottom) + 28px)}
#lock .time{font-family:var(--fb);font-weight:500;font-size:84px;line-height:1;letter-spacing:-3px;position:relative;z-index:1;margin-top:10px}
#lock .date{font-size:18px;opacity:.85;position:relative;z-index:1;margin-top:6px}
.notif{position:relative;z-index:1;width:100%;margin-top:40px;background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-radius:22px;padding:14px 16px;display:flex;gap:12px;align-items:center;transform:translateY(-140%) scale(.9);opacity:0;transition:transform .7s cubic-bezier(.2,1.4,.4,1),opacity .4s}
.notif.in{transform:none;opacity:1}
.notif .ic{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#34d399,#16a34a);display:grid;place-items:center;font-size:22px;flex:none}
.notif b{display:block;font-size:15px}.notif span{font-size:14px;opacity:.85}
.notif small{margin-left:auto;opacity:.6;font-size:12px;align-self:flex-start}
.unlock{position:relative;z-index:1;margin-top:auto;width:100%}
.track{position:relative;height:64px;border-radius:40px;background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);overflow:hidden;touch-action:none}
.track .lbl{position:absolute;inset:0;display:grid;place-items:center;font-weight:500;letter-spacing:.5px;
  background:linear-gradient(90deg,rgba(255,255,255,.35) 0%,#fff 50%,rgba(255,255,255,.35) 100%);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.2s linear infinite;padding-left:40px}
@keyframes shine{to{background-position:-200% 0}}
.handle{position:absolute;left:6px;top:6px;width:52px;height:52px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-size:22px;touch-action:none;cursor:grab}

/* ---------- chat ---------- */
#chat,#verify{display:flex;flex-direction:column}
.chead{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;border-bottom:1px solid var(--glass-b);background:rgba(11,7,20,.5);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--violet));display:grid;place-items:center;font-weight:700;font-family:var(--fd);flex:none}
.chead b{display:block}.chead small{opacity:.6;font-size:12px}
.msgs{position:relative;z-index:1;flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:10px}
.b{max-width:80%;padding:11px 15px;border-radius:20px;font-size:16px;line-height:1.35;animation:pop .35s cubic-bezier(.2,1.5,.4,1) both}
.b.bot{background:var(--glass);border:1px solid var(--glass-b);align-self:flex-start;border-bottom-left-radius:6px}
.b.me{background:linear-gradient(135deg,var(--pink),var(--violet));align-self:flex-end;border-bottom-right-radius:6px}
.typing{display:flex;gap:5px;align-items:center;padding:14px 16px}
.typing i{width:8px;height:8px;border-radius:50%;background:#fff;opacity:.5;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{transform:translateY(-5px);opacity:1}}
@keyframes pop{from{transform:scale(.7) translateY(10px);opacity:0}}
.composer{position:relative;z-index:2;display:flex;gap:10px;padding:12px 14px calc(env(safe-area-inset-bottom) + 14px);transition:opacity .3s,transform .3s}
.composer.off{opacity:0;pointer-events:none;transform:translateY(20px)}
.composer input,.field{flex:1;background:var(--glass);border:1px solid var(--glass-b);border-radius:30px;padding:14px 18px;font-size:16px;outline:none;-webkit-user-select:text;user-select:text}
.composer input:focus,.field:focus{border-color:var(--pink)}
.send{width:50px;height:50px;border-radius:50%;border:0;background:var(--lime);color:#111;font-size:20px;font-weight:700;flex:none}
.btn{border:0;border-radius:30px;padding:15px 26px;font-weight:700;font-size:16px;background:var(--lime);color:#111}
.btn.ghost{background:var(--glass);color:#fff;border:1px solid var(--glass-b)}
.btn:active,.send:active{transform:scale(.95)}

/* ---------- verify ---------- */
.vwrap{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:18px}
.vwrap h2{font-family:var(--fd);font-size:30px;line-height:1.05}
.vwrap p{opacity:.8;max-width:300px}
.vpanel{display:none;flex-direction:column;align-items:center;gap:18px;width:100%}.vpanel.on{display:flex;animation:pop .45s both}
.finger{position:relative;width:150px;height:150px;border-radius:50%;display:grid;place-items:center;font-size:64px;background:var(--glass);border:1px solid var(--glass-b);touch-action:none}
.finger svg{position:absolute;inset:-6px;width:162px;height:162px;transform:rotate(-90deg)}
.finger circle{fill:none;stroke-width:5;stroke-linecap:round}
.finger .bg{stroke:rgba(255,255,255,.12)}.finger .fg{stroke:var(--lime);stroke-dasharray:490;stroke-dashoffset:490}
.finger.ok{background:rgba(198,255,61,.18)}
.finger.scan::after{content:"";position:absolute;left:14px;right:14px;height:3px;background:var(--lime);box-shadow:0 0 14px var(--lime);animation:scanl 1s ease-in-out infinite alternate}
@keyframes scanl{from{top:22px}to{top:120px}}
.vstatus{font-weight:700;min-height:26px;color:var(--lime)}

/* ---------- stories ---------- */
#stories{background:#0b0714}
.sbar{position:absolute;z-index:20;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;display:flex;gap:4px;pointer-events:none}
.sbar i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.28);overflow:hidden}
.sbar b{display:block;height:100%;background:#fff;transform:scaleX(0);transform-origin:left}
.shead{position:absolute;z-index:20;top:calc(env(safe-area-inset-top) + 22px);left:14px;right:14px;display:flex;align-items:center;gap:10px;pointer-events:none}
.shead .av{width:34px;height:34px;font-size:14px}
.shead span{font-weight:700;font-size:14px}.shead small{opacity:.6;margin-left:4px}
.mute{margin-left:auto;pointer-events:auto;width:36px;height:36px;border-radius:50%;border:0;background:var(--glass);backdrop-filter:blur(8px);font-size:16px;display:none}
#zones{position:absolute;inset:0;z-index:2}
#slides{position:absolute;inset:0;z-index:5;pointer-events:none}
.slide{position:absolute;inset:0;pointer-events:none;overflow:hidden;padding:calc(env(safe-area-inset-top) + 70px) 20px calc(env(safe-area-inset-bottom) + 70px);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:sin .5s ease both}
@keyframes sin{from{opacity:0;transform:scale(1.06)}}
.ix{pointer-events:auto}
.nextpill{position:absolute;z-index:20;bottom:calc(env(safe-area-inset-bottom) + 18px);left:50%;transform:translateX(-50%);background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(10px);
  border-radius:30px;padding:10px 20px;font-size:14px;font-weight:700;display:none;animation:nudge 1.6s ease-in-out infinite}
.nextpill.on{display:block}
@keyframes nudge{50%{transform:translateX(-50%) translateX(6px)}}
body.paused .sbar{opacity:.4}

/* hero */
.hero{text-align:center}
.kin{display:flex;flex-direction:column;align-items:center;font-family:var(--fd);font-weight:800;line-height:.95;position:relative;z-index:2}
.kin .ln{display:flex;justify-content:center;font-size:clamp(46px,16vw,78px);letter-spacing:-1px}
.kin .ln.nm{font-size:clamp(40px,14vw,70px);margin-top:10px}
.kin .l{display:inline-block;opacity:0;transform:translateY(60px) rotate(12deg) scale(.5);animation:letter .7s cubic-bezier(.2,1.6,.4,1) forwards,bob 2.6s ease-in-out infinite;
  background:linear-gradient(180deg,#fff,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,78,205,.55))}
.kin .nm .l{background:linear-gradient(180deg,var(--lime),var(--sky));-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 18px rgba(198,255,61,.5))}
@keyframes letter{to{opacity:1;transform:none}}
@keyframes bob{50%{translate:0 -7px}}
.hero .sub{margin-top:26px;font-size:18px;opacity:0;animation:fadeup .8s 2.2s forwards;max-width:300px;position:relative;z-index:2}
@keyframes fadeup{from{transform:translateY(14px)}to{opacity:.9;transform:none}}
.balloons{position:absolute;inset:0;z-index:1;overflow:hidden}
.bl{position:absolute;bottom:-120px;width:54px;height:68px;border-radius:50% 50% 48% 48%;animation:rise linear infinite;opacity:.9}
.bl::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:50px;background:rgba(255,255,255,.4)}
@keyframes rise{to{transform:translateY(-120vh) rotate(14deg)}}
.emoji-rain{position:absolute;inset:0;z-index:1;pointer-events:none}
.emoji-rain span{position:absolute;top:-40px;font-size:24px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}

/* candle */
.candle{text-align:center;gap:14px}
.candle h3,.sec-h{font-family:var(--fd);font-size:30px;line-height:1.05}
.cakewrap{width:min(78vw,300px);touch-action:none;position:relative}
.cakewrap svg{width:100%;height:auto;overflow:visible}
.flame{transform-origin:50% 100%;transform-box:fill-box;animation:flick .25s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.88,1.1) rotate(3deg)}}
.blown .flame{animation:none;transform:scale(0);opacity:0;transition:.4s}
.smoke{opacity:0}.blown .smoke{animation:smoke 2s ease-out forwards}
@keyframes smoke{from{opacity:.8;transform:translateY(0)}to{opacity:0;transform:translateY(-50px)}}
.meter{width:min(70vw,260px);height:8px;border-radius:8px;background:var(--glass);overflow:hidden;margin:0 auto}
.meter b{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--lime));transform:scaleX(0);transform-origin:left}
.candle .hint{font-size:16px;opacity:.85;min-height:24px}

/* swipe */
.swipe{gap:14px;text-align:center}
.stack{position:relative;width:min(80vw,330px);height:min(62dvh,470px);touch-action:none}
.card{position:absolute;inset:0;border-radius:26px;overflow:hidden;background:#222 center/cover;box-shadow:0 18px 40px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.2,1,.3,1),opacity .3s;will-change:transform}
.card img{width:100%;height:100%;object-fit:cover;pointer-events:none;display:block}
.card .cap{position:absolute;left:0;right:0;bottom:0;padding:60px 18px 18px;text-align:left;font-weight:700;font-size:20px;background:linear-gradient(transparent,rgba(0,0,0,.8))}
.stamp{position:absolute;top:22px;left:20px;border:4px solid var(--lime);color:var(--lime);padding:2px 12px;border-radius:10px;font-family:var(--fd);font-size:30px;transform:rotate(-14deg);opacity:0}
.toast{position:absolute;left:50%;top:14%;transform:translateX(-50%) translateY(-10px);background:#fff;color:#111;padding:10px 16px;border-radius:30px;font-weight:700;font-size:14px;opacity:0;transition:.3s;z-index:30;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.match{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:3;text-align:center}
.match.on{display:flex;animation:pop .5s both}
.match h2{font-family:var(--fd);font-size:44px;background:linear-gradient(90deg,var(--pink),var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent}

/* polaroid */
.board{position:relative;width:100%;height:min(66dvh,520px);touch-action:none}
.pol{position:absolute;width:48%;background:#fffdf7;padding:8px 8px 30px;border-radius:4px;box-shadow:0 12px 26px rgba(0,0,0,.5);touch-action:none;color:#222;cursor:grab}
.pol img{width:100%;aspect-ratio:1;object-fit:cover;display:block;pointer-events:none;background:#ddd}
.pol span{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:13px;font-weight:700}
.pol::before{content:"";position:absolute;top:-10px;left:50%;width:60px;height:20px;background:rgba(255,220,120,.7);transform:translateX(-50%) rotate(-3deg)}

/* reel */
.reelwrap{width:calc(100% + 40px);margin:0 -20px}
.reel{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;padding:20px 14%;scrollbar-width:none;perspective:900px;-webkit-overflow-scrolling:touch}
.reel::-webkit-scrollbar{display:none}
.rc{flex:none;width:72%;aspect-ratio:3/4.3;scroll-snap-align:center;border-radius:24px;overflow:hidden;position:relative;background:#222;box-shadow:0 20px 40px rgba(0,0,0,.5);transition:transform .08s linear}
.rc img{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;display:block}
.rc span{position:absolute;left:0;right:0;bottom:0;padding:50px 16px 16px;font-weight:700;font-size:18px;background:linear-gradient(transparent,rgba(0,0,0,.75))}

/* wrapped */
.wrapped{align-items:stretch;justify-content:center;gap:12px}
.wrapped h3{font-family:var(--fd);font-size:34px;line-height:1;margin-bottom:6px}
.stat{border-radius:22px;padding:16px 18px;opacity:0;transform:translateY(30px) scale(.95);animation:statin .6s cubic-bezier(.2,1.4,.4,1) forwards;color:#111}
.stat small{display:block;font-size:13px;font-weight:700;opacity:.7;text-transform:uppercase;letter-spacing:.6px}
.stat b{display:block;font-family:var(--fd);font-size:34px;line-height:1.05;margin-top:2px}
.stat:nth-child(2){background:var(--lime)}.stat:nth-child(3){background:var(--pink)}.stat:nth-child(4){background:var(--sun)}.stat:nth-child(5){background:var(--sky)}.stat:nth-child(6){background:var(--violet)}
@keyframes statin{to{opacity:1;transform:none}}

/* final */
.final{text-align:center;gap:16px}
.fcard{width:100%;background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:28px;padding:26px 22px}
.fcard h2{font-family:var(--fd);font-size:30px;margin-bottom:14px}
.fcard p{font-size:18px;line-height:1.5;min-height:150px;text-align:left;white-space:pre-line}
.fcard .caret::after{content:"▍";animation:blink2 .8s steps(1) infinite;color:var(--lime)}
@keyframes blink2{50%{opacity:0}}
.fbtns{display:flex;gap:10px;justify-content:center;margin-top:16px;opacity:0;transition:opacity .6s}.fbtns.on{opacity:1}
.sign{margin-top:12px;opacity:.7;font-size:14px}

@media (prefers-reduced-motion:reduce){
  .mesh i,.bl,.emoji-rain span,.kin .l,.nextpill,.flame{animation-duration:.01s!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>

<div class="gate">
  <h1>Phone e khol 📱</h1>
  <p>Ei surprise sudhu mobile er jonno.</p>
  <img id="qr" alt="QR">
  <p style="font-size:13px">Phone camera diye scan koro</p>
</div>

<div id="app">

  <!-- 1. LOCK -->
  <section class="step active" id="lock">
    <div class="mesh"><i></i><i></i><i></i></div>
    <div class="time" id="clock">9:41</div>
    <div class="date" id="cdate"></div>
    <div class="notif" id="notif">
      <div class="ic">💬</div>
      <div><b id="nTitle"></b><span id="nText"></span></div>
      <small>now</small>
    </div>
    <div class="unlock">
      <div class="track" id="track">
        <div class="lbl">slide to open 🎁</div>
        <div class="handle" id="handle">➜</div>
      </div>
    </div>
  </section>

  <!-- 2. CHAT -->
  <section class="step" id="chat">
    <div class="mesh"><i></i><i></i><i></i></div>
    <div class="chead"><div class="av" id="chAv"></div><div><b id="chName"></b><small>online</small></div></div>
    <div class="msgs" id="msgs"></div>
    <form class="composer off" id="nameForm" autocomplete="off">
      <input id="nameIn" type="text" placeholder="Tomar naam..." maxlength="24" enterkeyhint="send">
      <button class="send" type="submit">↑</button>
    </form>
  </section>

  <!-- 3. VERIFY -->
  <section class="step" id="verify">
    <div class="mesh"><i></i><i></i><i></i></div>
    <div class="vwrap">
      <div class="vpanel on" id="vq">
        <h2>🔐 Main Character<br>Verification</h2>
        <p id="vqText"></p>
        <form id="secretForm" style="width:100%;display:flex;flex-direction:column;gap:12px;align-items:center" autocomplete="off">
          <input class="field" id="secretIn" style="width:100%;flex:none;text-align:center" maxlength="40" enterkeyhint="done">
          <button class="btn" type="submit">Continue →</button>
        </form>
      </div>
      <div class="vpanel" id="vf">
        <h2>Last step ✨</h2>
        <p>Fingerprint ta dhore rakho, scan complete na howa porjonto.</p>
        <div class="finger ix" id="finger">
          <svg viewBox="0 0 162 162"><circle class="bg" cx="81" cy="81" r="78"/><circle class="fg" id="fRing" cx="81" cy="81" r="78"/></svg>
          <span>👆</span>
        </div>
        <div class="vstatus" id="vstatus">hold to scan</div>
      </div>
    </div>
  </section>

  <!-- 4. STORIES -->
  <section class="step" id="stories">
    <div class="mesh"><i></i><i></i><i></i></div>
    <div class="sbar" id="sbar"></div>
    <div class="shead"><div class="av" id="sAv"></div><span id="sName"></span><small>• just now</small><button class="mute" id="mute">🔊</button></div>
    <div id="zones"></div>
    <div id="slides"></div>
    <button class="nextpill" id="nextpill">Next ›</button>
  </section>
</div>

<script>
/* =====================================================================
   CONFIG — shob content ekhane. Code touch korar dorkar nai.
   ===================================================================== */
const CONFIG = {
  fromName: "Shrabon",              // tumi (sender)
  defaultName: "Bondhu",            // naam na dile fallback
  notification: { title: "Shrabon", text: "Ekta surprise tomar jonno wait korche... 👀" },
  askName: "Hey! 👋 Tumi ke bolo to?",
  greet: (n) => [`Hey ${n}! 😍`, "Ekta special jinis ready kore rekhechi...", "Tar age ekta choto verification lagbe 🔐"],
  secret: { question: "Tomar sobcheye favourite khabar ki? 🍕", placeholder: "Ekhane lekho..." },
  heroSub: "Aj tomar din. Tomar moto manush ke celebrate korte pere ami lucky 🫶",
  candleTitle: "Ekta wish koro...",
  swipeTitle: "Memory lane 💘",
  polTitle: "Scrapbook 📸",
  reelTitle: "Tomar best looks ✨",
  wrappedTitle: "Tomar Year Wrapped 🎧",
  // count = number count-up korbe, suffix er sathe. text = simple string value.
  wrapped: [
    { label: "Friendship level", count: 100, suffix: "%" },
    { label: "Times you made me laugh", text: "∞" },

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const vibrate = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const COLORS = ["#ff4ecd", "#a78bfa", "#c6ff3d", "#ffd166", "#4cc9f0"];

function show(id) { $$(".step").forEach((s) => s.classList.toggle("active", s.id === id)); }

/* ---------- confetti helpers ---------- */
const fire = (o) => { if (window.confetti) confetti(Object.assign({ disableForReducedMotion: true, zIndex: 200, colors: COLORS }, o)); };
const burst = () => fire({ particleCount: 140, spread: 95, origin: { y: 0.6 } });
const sides = () => {
  fire({ particleCount: 36, angle: 60, spread: 65, origin: { x: 0, y: 0.75 } });
  fire({ particleCount: 36, angle: 120, spread: 65, origin: { x: 1, y: 0.75 } });
};
function bigBlast() {
  burst(); vibrate([40, 40, 80, 40, 120]);
  let n = 0; const t = setInterval(() => { sides(); fire({ particleCount: 60, spread: 360, startVelocity: 25, origin: { x: Math.random(), y: Math.random() * 0.5 } }); if (++n > 7) clearInterval(t); }, 260);
  try {
    if (window.confetti && confetti.shapeFromText) {
      const gift = confetti.shapeFromText({ text: "🎁", scalar: 3 }), heart = confetti.shapeFromText({ text: "💖", scalar: 3 });
      fire({ shapes: [gift, heart], scalar: 3, particleCount: 40, spread: 120, origin: { y: 0.7 }, colors: undefined });
    }
  } catch (e) {}
}

   ===================================================================== */
function bootLock() {
  const tick = () => {
    const d = new Date();
    $("#clock").textContent = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", hour12: false });
    $("#cdate").textContent = d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  };
  tick(); setInterval(tick, 1000);
  $("#nTitle").textContent = CONFIG.notification.title;
  $("#nText").textContent = CONFIG.notification.text;
  setTimeout(() => { $("#notif").classList.add("in"); vibrate([60, 60, 60]); }, 1300);

  const track = $("#track"), handle = $("#handle");
  let dragging = false, sx = 0, x = 0;
  const max = () => track.clientWidth - handle.clientWidth - 12;
  handle.addEventListener("pointerdown", (e) => { dragging = true; sx = e.clientX - x; handle.setPointerCapture(e.pointerId); handle.style.transition = "none"; });
  handle.addEventListener("pointermove", (e) => {
    if (!dragging) return; x = clamp(e.clientX - sx, 0, max());
    handle.style.transform = `translateX(${x}px)`; $(".lbl", track).style.opacity = 1 - x / (max() * 0.6);
  });
  const end = () => {
    if (!dragging) return; dragging = false;
    if (x > max() * 0.8) { vibrate(30); startMusic(); startChat(); }
    else { x = 0; handle.style.transition = "transform .35s cubic-bezier(.2,1.5,.4,1)"; handle.style.transform = ""; $(".lbl", track).style.opacity = 1; }
  };
  handle.addEventListener("pointerup", end); handle.addEventListener("pointercancel", end);
}

(function fingerprint() {
  const f = $("#finger"), ring = $("#fRing"), st = $("#vstatus"), NEED = 1900, LEN = 490;
  let raf = 0, t0 = 0, done = false;
  const loop = (now) => {
    const p = clamp((now - t0) / NEED, 0, 1);
    ring.style.strokeDashoffset = LEN * (1 - p);
    st.textContent = "scanning... " + Math.round(p * 100) + "%";
    if (p >= 1) return finish();
    if (Math.round(p * 100) % 25 === 0) vibrate(8);
    raf = requestAnimationFrame(loop);
  };
  const start = (e) => { if (done) return; t0 = performance.now(); f.classList.add("scan"); raf = requestAnimationFrame(loop); f.setPointerCapture && f.setPointerCapture(e.pointerId); };
  const cancel = () => { if (done) return; cancelAnimationFrame(raf); f.classList.remove("scan"); ring.style.strokeDashoffset = LEN; st.textContent = "hold to scan"; };
  async function finish() {
    done = true; f.classList.remove("scan"); f.classList.add("ok"); vibrate([30, 40, 90]);
    st.textContent = "Identity confirmed ✅ VIP unlocked"; burst();
    await sleep(1500); startStories();
  }
  f.addEventListener("pointerdown", start);
  ["pointerup", "pointercancel"].forEach((ev) => f.addEventListener(ev, cancel));
})();

function letters(text, start) {
  return [...text].map((c, i) => `<span class="l" style="animation-delay:${start + i * 0.06}s,${(i * 0.17).toFixed(2)}s">${c === " " ? "&nbsp;" : esc(c)}</span>`).join("");
}
function typewrite(el, text, speed, onDone) {
  let i = 0; el.classList.add("caret");
  const t = setInterval(() => {
    el.textContent = text.slice(0, ++i);
    if (i % 3 === 0) vibrate(4);
    if (i >= text.length) { clearInterval(t); el.classList.remove("caret"); onDone && onDone(); }
  }, speed);
  return t;
}

/* ---------- story engine ---------- */
let idx = -1, elapsed = 0, lastT = 0, paused = false, held = false, raf = 0, cur = null, cleanup = null, started = false;
const api = { next: () => next(), go: (i) => go(i), pause: (v) => { paused = v; }, cur: () => cur };

function startStories() {
  $("#sName").textContent = CONFIG.fromName; $("#sAv").textContent = CONFIG.fromName[0];
  $("#sbar").innerHTML = SLIDES.map(() => "<i><b></b></i>").join("");
  show("stories"); if (!started) { started = true; bindZones(); } go(0);
  cancelAnimationFrame(raf); lastT = performance.now(); raf = requestAnimationFrame(tick);
}
function go(i) {
  if (i < 0) i = 0; if (i >= SLIDES.length) return;
  if (cleanup) { try { cleanup(); } catch (e) {} cleanup = null; }
  if (cur) cur.remove();
  idx = i; elapsed = 0; paused = false;
  const s = SLIDES[i], box = $("#slides"); box.insertAdjacentHTML("beforeend", s.html()); cur = box.lastElementChild;
  $$("#sbar b").forEach((b, k) => { b.style.transform = `scaleX(${k < i ? 1 : 0})`; });
  if (!s.dur) $$("#sbar b")[i].style.transform = "scaleX(1)";
  $("#nextpill").classList.toggle("on", !s.dur && i < SLIDES.length - 1);
